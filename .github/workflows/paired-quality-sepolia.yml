name: Paired Quality Verification - Sepolia

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-sepolia-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TARGET_NETWORK: sepolia
      CONTRACT: ${{ vars.CONTRACT_ADDRESS }}
      SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
      SEPOLIA_KEYSTORE_JSON: ${{ secrets.SEPOLIA_KEYSTORE_JSON }}
      SEPOLIA_KEYSTORE_PASSWORD: ${{ secrets.SEPOLIA_KEYSTORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Set up Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: |
          npm test
          npm run typecheck

      - name: Validate Solidity
        working-directory: blockchain
        run: |
          forge test
          forge build

      - name: Check Sepolia connection
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SEPOLIA_RPC_URL"
          test -n "$SEPOLIA_KEYSTORE_JSON"
          test -n "$SEPOLIA_KEYSTORE_PASSWORD"

          CHAIN_ID=$(cast chain-id --rpc-url "$SEPOLIA_RPC_URL")
          test "$CHAIN_ID" = "11155111"

          CODE=$(cast code "$CONTRACT" \
            --rpc-url "$SEPOLIA_RPC_URL")
          test "$CODE" != "0x"

          echo "Sepolia connection OK"

      - name: Validate deployed contract
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$CONTRACT" =~ ^0x[0-9a-fA-F]{40}$ ]]; then
            echo "ERROR: Configure CONTRACT_ADDRESS in GitHub Actions Variables."
            exit 1
          fi

          CHAIN_ID=$(cast chain-id --rpc-url "$SEPOLIA_RPC_URL")

          if [ "$CHAIN_ID" != "11155111" ]; then
            echo "ERROR: RPC is not connected to Sepolia."
            exit 1
          fi

          CODE=$(cast code "$CONTRACT" --rpc-url "$SEPOLIA_RPC_URL")

          if [ "$CODE" = "0x" ]; then
            echo "ERROR: No contract found at CONTRACT_ADDRESS."
            exit 1
          fi

          AUTHORIZED=$(cast call "$CONTRACT" \
            "authorizedEvaluator()(address)" \
            --rpc-url "$SEPOLIA_RPC_URL")

          echo "Contract address: $CONTRACT"
          echo "Authorized evaluator: $AUTHORIZED"
          echo "Contract validation successful."

      - name: Validate experimental subject tags
        shell: bash
        run: |
          set -euo pipefail

          for tag in \
            subject-e1-v1 \
            subject-e2-v1 \
            subject-e3-v1 \
            subject-e4-v1; do

            echo "Checking $tag"
            git rev-parse --verify "$tag^{commit}"
          done

      - name: Record experiment metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prototype-data

          {
            echo "GitHub run: $GITHUB_RUN_ID"
            echo "Run attempt: $GITHUB_RUN_ATTEMPT"
            echo "Workflow commit: $GITHUB_SHA"
            echo "Network: Sepolia (11155111)"
            echo "Contract: $CONTRACT"
            echo "Recorded at: $(date -u +%FT%TZ)"

            for scenario in e1 e2 e3 e4; do
              tag="subject-${scenario}-v1"
              echo "$tag: $(git rev-parse "$tag^{commit}")"
            done
          } > prototype-data/experiment-metadata.txt

      - name: Run 20 experimental paired evaluations
        shell: bash
        run: |
          set -euo pipefail

          SCENARIOS=(E1 E2 E3 E4)

          for repeat in {1..5}; do
            offset=$(( (repeat - 1) % 4 ))

            for step in {0..3}; do
              index=$(( (offset + step) % 4 ))
              scenario="${SCENARIOS[$index]}"

              echo "================================"
              echo "Scenario: $scenario"
              echo "Repetition: $repeat"
              echo "================================"

              node scripts/run-subject-pair.mjs \
                "$scenario" \
                --repeat "$repeat" \
                --send
            done
          done

      - name: Validate experimental dataset
        shell: bash
        run: |
          set -euo pipefail

          FILE="prototype-data/paired-subject-sepolia-dev.jsonl"

          jq -s -e '
            (length == 20) and

            (([.[].evaluationId] | unique | length) == 20) and

            (([.[].transactionHash] | unique | length) == 20) and

            (([.[].commitSha] | unique | length) == 4) and

            (
              ([.[].scenarioId] |
                group_by(.) |
                map({scenario: .[0], count: length}) |
                sort_by(.scenario))
              ==
              [
                {"scenario":"E1","count":5},
                {"scenario":"E2","count":5},
                {"scenario":"E3","count":5},
                {"scenario":"E4","count":5}
              ]
            ) and

            (all(.[];
              .chainId == 11155111 and
              (.gasUsed | type) == "number" and
              .gasUsed > 0 and
              (.differenceMs | type) == "number" and
              (.transactionHash |
                test("^0x[0-9a-fA-F]{64}$"))
            ))
          ' "$FILE"

          echo "Dataset structure validated."

      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paired-quality-real-metrics-sepolia
          path: prototype-data/
          if-no-files-found: warn
